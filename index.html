<!DOCTYPE html>
<html>
    <head>
        <title>
            Application-Form
        </title>
    </head>
    <style>
        .login-info{
            text-align: center;
            margin-top: 200px;
        }
        .ig-photo{
            width: 40px;
            margin-bottom: 100px;
        }
        .button-opo{
            width: 300px;
            padding:0;
            height:35px;
            border-radius: 25px;
            border: none;
            background-color: blue;
            color: white;
            font-family: arial;
            cursor: pointer;

            
        }
        .button-opo:hover{
            background-color: rgb(33, 51, 205);
        }
        .input-opo{
            width:300px;
            padding-left: 10px;
            height: 45px;
            border-radius: 10px;
            border-style: solid;
            font-family: arial;
            border-color: rgb(226, 230, 233);
            border-width: 1px;



        }
        .input-top{
            width:300px;
            padding-left: 10px;
            height: 45px;
            border-radius: 10px;
            border-style: solid;
            font-family: arial;
            border-color: rgb(226, 230, 233);
            border-width: 1px;
            
            
        }
        .link-top{
            font-family: arial;
            text-decoration: none;
            color: rgb(33, 28, 28);
            font-size: 13px;
        }
        .header-to{
            text-align: center;
            font-family: arial;
            margin-top: 50px;
            color: blue;
        }
    </style>
    <body>
        <h1 class="header-to">LOG IN Instagram</h1>
        <div class="login-info">
             <div>
            <img class="ig-photo" src="images.jpg">
        </div>
        <div>
            <input class="input-opo" type="text" id="text" placeholder="Username,email or mobile number">
            <br>
            <br>
            <input class="input-top" type="password" id="pass" placeholder="Password">
            <br>
            <br>
            <div>
                 <button class="button-opo">
                Log in
            </button>

            </div>
           
        </div>
        <br>
        <div>
            <a class="link-top"  href="https://goolgle.com">Forgot password?</a>
        </div>

        </div>
       
    </body>
</html>
